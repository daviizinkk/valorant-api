<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VALORANT Skin & Map Showcase</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', -apple-system, sans-serif;
    background: #0e1420;
    color: #edf0f5;
    min-height: 100vh;
  }

  .header {
    background: linear-gradient(135deg, #111b28, #0d1520);
    border-bottom: 1px solid #253445;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header h1 { font-size: 20px; font-weight: 800; color: #ff4655; }
  .header .subtitle { font-size: 12px; color: #7a8da0; }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .controls select, .controls input {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #253445;
    background: #16202c;
    color: #edf0f5;
    font-size: 12px;
    outline: none;
  }
  .controls button {
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    background: #ff4655;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
  }
  .controls button:hover { filter: brightness(1.15); }

  .container {
    max-width: 1600px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 16px;
    min-height: calc(100vh - 80px);
  }

  /* Sidebar */
  .sidebar {
    background: #111b28;
    border: 1px solid #253445;
    border-radius: 10px;
    padding: 14px;
    overflow-y: auto;
    max-height: calc(100vh - 100px);
  }
  .sidebar h3 { font-size: 12px; color: #7a8da0; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

  .map-list-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1.5px solid transparent;
    transition: all 0.15s;
  }
  .map-list-item:hover { background: #16202c; border-color: #253445; }
  .map-list-item.active { background: #ff465510; border-color: #ff4655; color: #ff4655; font-weight: 600; }
  .map-list-item img { width: 32px; height: 32px; border-radius: 4px; object-fit: cover; }

  .skin-list {
    max-height: calc(100vh - 300px);
    overflow-y: auto;
  }
  .skin-list-item {
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid transparent;
    margin-bottom: 1px;
  }
  .skin-list-item:hover { background: #16202c; border-color: #253445; }
  .skin-list-item.active { background: #ff465510; border-color: #ff4655; }

  /* Main viewer */
  .viewer {
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    background: #0a1018;
    border: 1px solid #253445;
  }
  .viewer .map-bg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0; left: 0;
    opacity: 0.3;
  }
  .viewer .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .viewer .skin-display {
    width: 80%;
    max-width: 600px;
    text-align: center;
  }
  .viewer .skin-display img { max-width: 100%; max-height: 50vh; object-fit: contain; }
  .viewer .skin-display video { width: 100%; max-height: 60vh; border-radius: 8px; }

  .viewer .controls-overlay {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }
  .viewer .controls-overlay button {
    padding: 6px 16px;
    border-radius: 20px;
    border: none;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
  }
  .viewer .controls-overlay button:hover { background: #ff4655; }

  .viewer .skin-name {
    margin-top: 12px;
    font-size: 22px;
    font-weight: 800;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .viewer .skin-meta {
    font-size: 13px;
    color: #7a8da0;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }

  /* Loading */
  .loading { text-align: center; padding: 60px; color: #7a8da0; font-size: 14px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #253445; border-top-color: #ff4655; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Selection info */
  .empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #7a8da0;
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }

  .scrollable { scrollbar-width: thin; scrollbar-color: #253445 transparent; }
  .scrollable::-webkit-scrollbar { width: 4px; }
  .scrollable::-webkit-scrollbar-thumb { background: #253445; border-radius: 2px; }

  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    .sidebar { max-height: 200px; }
    .skin-list { max-height: 150px; }
  }
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1>VALORANT x Map Showcase</h1>
      <div class="subtitle">Every skin in its best map environment — official Riot preview videos + map art</div>
    </div>
    <div class="controls">
      <select id="tierFilter"><option value="">All Tiers</option></select>
      <input type="text" id="searchInput" placeholder="Search a skin..." style="width:140px">
      <span id="skinCount" style="font-size:12px;color:#7a8da0">0</span>
    </div>
  </div>

  <div class="container">
    <div class="sidebar scrollable">
      <h3>Maps</h3>
      <div id="mapList"></div>
      <h3 style="margin-top:14px">Skins</h3>
      <input type="text" id="skinFilter" placeholder="Filter skins..." style="width:100%;padding:6px 10px;border-radius:4px;border:1px solid #253445;background:#16202c;color:#edf0f5;font-size:11px;margin-bottom:6px;outline:none">
      <div id="skinList" class="skin-list scrollable"></div>
    </div>
    <div class="viewer" id="viewer">
      <div class="empty-state" id="emptyState">
        <div>
          <div style="font-size:40px;margin-bottom:12px">🎯</div>
          <div>Select a map and a skin from the sidebar</div>
          <div style="font-size:12px;color:#555;margin-top:6px">Skins are shown on official map art backgrounds</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TIERS = {
      '0cebb8be-46d7-c12a-d306-e9907bfc5a25': { name: 'Deluxe' },
      '12683d76-48d7-84a3-4e09-6985794f0445': { name: 'Premium' },
      '60bca009-4182-7998-dee7-b8a2558dc369': { name: 'Exclusive' },
      'e046854e-406c-37f4-6607-19a9ba8426fc': { name: 'Ultra' },
    };

    let allSkins = [];
    let allMaps = [];
    let weapons = [];
    let selectedMap = null;
    let selectedSkin = null;
    let currentVideo = null;

    async function load() {
      try {
        const [mapRes, weaponRes, fullSkinRes] = await Promise.all([
          fetch('https://valorant-api.com/v1/maps'),
          fetch('https://valorant-api.com/v1/weapons'),
          fetch('https://valorant-api.com/v1/weapons/skins?language=all'),
        ]);
        const mapData = await mapRes.json();
        const weaponData = await weaponRes.json();
        const skinData = await fullSkinRes.json();

        if (mapData.status !== 200 || weaponData.status !== 200 || skinData.status !== 200)
          throw new Error('API error');

        // Filter to real maps only
        allMaps = (mapData.data || []).filter(m =>
          m.displayIcon && !m.displayName.includes('Range')
        );

        weapons = weaponData.data || [];
        allSkins = skinData.data || [];

        populateFilters();
        renderMapList();
        populateSkinList();

        // Select first map by default
        if (allMaps.length) selectMap(allMaps[0].uuid);

        document.getElementById('searchInput').addEventListener('input', populateSkinList);
        document.getElementById('tierFilter').addEventListener('change', populateSkinList);
        document.getElementById('skinFilter').addEventListener('input', populateSkinList);
      } catch (err) {
        document.body.innerHTML = `<div class="loading"><div class="spinner"></div>Error: ${err.message}</div>`;
      }
    }

    function populateFilters() {
      const sel = document.getElementById('tierFilter');
      for (const [uuid, info] of Object.entries(TIERS)) {
        const opt = document.createElement('option');
        opt.value = uuid; opt.textContent = info.name; sel.appendChild(opt);
      }
    }

    function weaponName(skinUuid) {
      for (const w of weapons) {
        if (w.skins?.some(s => s.uuid === skinUuid)) return w.displayName;
      }
      const skin = allSkins.find(s => s.uuid === skinUuid);
      return '';
    }

    function tierInfo(skin) {
      return TIERS[skin.contentTierUuid] || { name: 'Select' };
    }

    function getFilteredSkins() {
      const tierFilter = document.getElementById('tierFilter').value;
      const search = document.getElementById('searchInput').value.toLowerCase();
      const skinFilter = document.getElementById('skinFilter').value.toLowerCase();
      const q = search || skinFilter;

      let skins = allSkins;
      if (tierFilter) skins = skins.filter(s => s.contentTierUuid === tierFilter);
      if (q) skins = skins.filter(s => s.displayName.toLowerCase().includes(q));
      return skins;
    }

    function renderMapList() {
      const el = document.getElementById('mapList');
      el.innerHTML = allMaps.map(m => `
        <div class="map-list-item ${selectedMap === m.uuid ? 'active' : ''}" data-uuid="${m.uuid}">
          <img src="${m.listViewIcon || m.displayIcon || ''}" alt="${m.displayName}" loading="lazy"
               onerror="this.style.display='none'">
          ${m.displayName}
        </div>
      `).join('');
      el.querySelectorAll('.map-list-item').forEach(item => {
        item.addEventListener('click', () => selectMap(item.dataset.uuid));
      });
    }

    function selectMap(uuid) {
      selectedMap = uuid;
      document.querySelectorAll('.map-list-item').forEach(el =>
        el.classList.toggle('active', el.dataset.uuid === uuid)
      );
      renderViewer();
    }

    function populateSkinList() {
      const el = document.getElementById('skinList');
      const filtered = getFilteredSkins();
      document.getElementById('skinCount').textContent = `${filtered.length} skins`;

      el.innerHTML = filtered.map(s => `
        <div class="skin-list-item ${selectedSkin === s.uuid ? 'active' : ''}" data-uuid="${s.uuid}">
          ${s.displayName}
        </div>
      `).join('');

      el.querySelectorAll('.skin-list-item').forEach(item => {
        item.addEventListener('click', () => selectSkin(item.dataset.uuid));
      });
    }

    function selectSkin(uuid) {
      selectedSkin = uuid;
      document.querySelectorAll('.skin-list-item').forEach(el =>
        el.classList.toggle('active', el.dataset.uuid === uuid)
      );
      renderViewer();
    }

    function renderViewer() {
      const viewer = document.getElementById('viewer');
      const empty = document.getElementById('emptyState');
      if (empty) empty.style.display = 'none';

      const map = allMaps.find(m => m.uuid === selectedMap);
      const skin = allSkins.find(s => s.uuid === selectedSkin);

      if (!map || !skin) return;

      // Get the skin's display icon + first video
      const firstVideo = skin.levels?.find(l => l.streamedVideo);

      let videoHtml = '';
      if (firstVideo) {
        videoHtml = `<video id="skinVideo" src="${firstVideo.streamedVideo}" autoplay loop muted
          style="width:100%;max-height:60vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.5)"></video>`;
      } else if (skin.displayIcon) {
        videoHtml = `<img src="${skin.displayIcon}" style="max-width:80%;max-height:50vh;object-fit:contain;filter:drop-shadow(0 4px 20px rgba(0,0,0,0.6))">`;
      }

      // Level badges
      let levelsHtml = '';
      if (skin.levels?.length > 1) {
        levelsHtml = skin.levels.map((l, i) => `
          <button onclick="playLevel('${l.uuid}', '${(l.streamedVideo || '').replace(/'/g, "\\'")}')"
            style="background:${l.streamedVideo ? 'rgba(15,159,255,0.3)' : 'rgba(0,0,0,0.4)'};border:1px solid ${l.streamedVideo ? '#0f9fff' : '#253445'}">
            Lv${i+1}${l.streamedVideo ? ' ▶' : ''}
          </button>
        `).join('');
      }

      // Weapon name
      const wName = weaponName(skin.uuid) || '';
      const tier = tierInfo(skin);

      viewer.innerHTML = `
        <img class="map-bg" src="${map.splash || map.stylizedBackgroundImage || map.displayIcon}" alt="${map.displayName}"
             onerror="this.style.display='none'">
        <div class="overlay">
          <div class="skin-display">
            ${videoHtml}
            <div class="skin-name">${skin.displayName}</div>
            <div class="skin-meta">
              ${wName ? `${wName} · ` : ''}${tier.name} · ${map.displayName}
            </div>
            ${levelsHtml ? `<div class="controls-overlay">${levelsHtml}</div>` : ''}
          </div>
        </div>
      `;

      currentVideo = document.getElementById('skinVideo');
    }

    function playLevel(levelUuid, videoUrl) {
      if (!videoUrl) return;
      const viewer = document.getElementById('viewer');
      const video = document.getElementById('skinVideo');
      if (video) {
        video.src = videoUrl;
        video.play().catch(() => {});
      } else {
        // Re-render with the new video
        const map = allMaps.find(m => m.uuid === selectedMap);
        const skin = allSkins.find(s => s.uuid === selectedSkin);
        if (skin) {
          const lvl = skin.levels?.find(l => l.uuid === levelUuid);
          if (lvl?.streamedVideo) {
            const existingOverlay = viewer.querySelector('.overlay');
            const videoEl = document.createElement('video');
            videoEl.src = lvl.streamedVideo;
            videoEl.autoplay = true;
            videoEl.loop = true;
            videoEl.muted = true;
            videoEl.style.cssText = 'width:100%;max-height:60vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.5)';
            const display = existingOverlay?.querySelector('.skin-display');
            if (display) {
              const oldMedia = display.querySelector('video, img');
              if (oldMedia) display.insertBefore(videoEl, oldMedia.nextSibling);
              oldMedia?.remove();
            }
          }
        }
      }
    }

    load();
  </script>
</body>
</html>
